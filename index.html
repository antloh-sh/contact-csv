<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAC Contact Converter | antloh-sh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        .gradient-bg { background: linear-gradient(135deg, #1e293b 0%, #334155 100%); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

    <div class="gradient-bg text-white py-10 px-6 shadow-lg">
        <div class="max-w-4xl mx-auto flex flex-col md:flex-row justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold">AAC Contact Converter</h1>
                <p class="text-slate-400 text-sm mt-1">Repository: antloh-sh/contact-csv</p>
            </div>
            <div class="mt-4 md:mt-0 bg-slate-700/50 px-4 py-2 rounded-lg border border-slate-600">
                <span class="text-xs uppercase tracking-widest text-slate-400 block mb-1">Status</span>
                <span class="text-green-400 font-mono text-sm">● Static HTML Ready</span>
            </div>
        </div>
    </div>

    <main class="max-w-4xl mx-auto -mt-8 px-6 pb-20">
        <div class="bg-white rounded-xl shadow-xl p-8 border border-slate-200">
            
            <div class="mb-8 p-6 bg-slate-50 rounded-lg border border-slate-100">
                <h2 class="text-sm font-semibold text-slate-700 uppercase tracking-wider mb-4">Filter by Modification Date</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">Modified From</label>
                        <input type="date" id="startDate" class="w-full px-4 py-2 rounded border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1">Modified To</label>
                        <input type="date" id="endDate" class="w-full px-4 py-2 rounded border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>
                <p class="text-[10px] text-slate-400 mt-2 italic">* Leave blank to include all records regardless of date.</p>
            </div>

            <div class="border-2 border-dashed border-slate-200 rounded-lg p-10 text-center hover:bg-slate-50 transition-all group">
                <input type="file" id="csvInput" accept=".csv" class="hidden">
                <label for="csvInput" class="cursor-pointer">
                    <div class="bg-indigo-50 w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition-transform">
                        <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    </div>
                    <span class="text-slate-700 font-semibold block">Upload DataListing-AACMembership.csv</span>
                    <span class="text-xs text-slate-400 mt-1">Files are processed locally and never uploaded to any server.</span>
                </label>
            </div>

            <div id="status" class="mt-6 hidden text-center p-4 rounded-lg font-medium text-sm"></div>

            <div id="actions" class="mt-8 flex flex-col md:flex-row justify-center items-center gap-4 hidden">
                <button id="downloadBtn" class="w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 text-white px-10 py-3 rounded-lg font-bold shadow-lg shadow-indigo-200 transition-all active:scale-95">
                    Download for Google Contacts
                </button>
                <button onclick="location.reload()" class="text-slate-500 hover:text-slate-800 text-sm font-medium">
                    Reset & Clear
                </button>
            </div>
        </div>
    </main>

    <script>
        const csvInput = document.getElementById('csvInput');
        const downloadBtn = document.getElementById('downloadBtn');
        const status = document.getElementById('status');
        const actions = document.getElementById('actions');
        const startDateInput = document.getElementById('startDate');
        const endDateInput = document.getElementById('endDate');

        let convertedData = null;

        // Function to parse the specific date format: 01-Sep-2025 06:35 PM
        function parseModifiedDate(dateStr) {
            if (!dateStr) return null;
            // Clean common artifacts
            const cleanStr = dateStr.trim();
            const dateObj = new Date(cleanStr);
            return isNaN(dateObj.getTime()) ? null : dateObj;
        }

        csvInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    processData(results.data);
                },
                error: function(err) {
                    showStatus('Error reading CSV: ' + err.message, 'bg-red-50 text-red-600 border border-red-100');
                }
            });
        });

        function toProperCase(str) {
            if (!str) return "";
            return str.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
        }

        function getSuffix(pc) {
            const code = parseInt(pc);
            if (isNaN(code)) return "@OB";
            if (code >= 347467 && code <= 349979) return "@SN";
            if (code >= 360001 && code <= 362016) return "@JS";
            if (code >= 367819 && code <= 369977) return "@MG";
            if (code >= 534068 && code <= 539746) return "@PL";
            return "@OB";
        }

        function processData(data) {
            try {
                const startFilter = startDateInput.value ? new Date(startDateInput.value) : null;
                const endFilter = endDateInput.value ? new Date(endDateInput.value) : null;
                if (endFilter) endFilter.setHours(23, 59, 59, 999); // Include full end day

                const filtered = data.filter(row => {
                    if (!startFilter && !endFilter) return true;
                    
                    const rowDate = parseModifiedDate(row.ModifiedOn);
                    if (!rowDate) return false; // Exclude if date is invalid but filter is active

                    if (startFilter && rowDate < startFilter) return false;
                    if (endFilter && rowDate > endFilter) return false;
                    return true;
                });

                if (filtered.length === 0) {
                    showStatus('No records found matching the selected date range.', 'bg-yellow-50 text-yellow-700 border border-yellow-100');
                    actions.classList.add('hidden');
                    return;
                }

                const output = filtered.map(row => {
                    const postalCode = row.PersonAddressPostalCode ? row.PersonAddressPostalCode.toString().replace('.0', '').padStart(6, '0') : "";
                    
                    return {
                        "Name Prefix": row.Salutation || "",
                        "First Name": toProperCase(row.FullName || ""),
                        "Address 1 - Postal Code": postalCode,
                        "Name Suffix": getSuffix(postalCode),
                        "Phone 1 - Value": row.MobilePhone ? row.MobilePhone.toString().replace('.0', '').trim() : "",
                        "Phone 1 - Type": row.MobilePhone ? "Mobile" : "",
                        "Phone 2 - Value": row.HomePhone ? row.HomePhone.toString().replace('.0', '').trim() : "",
                        "Phone 2 - Type": row.HomePhone ? "Home" : ""
                    };
                });

                convertedData = output;
                showStatus(`Ready! Processed ${output.length} records after filtering.`, 'bg-green-50 text-green-700 border border-green-100');
                actions.classList.remove('hidden');
            } catch (err) {
                showStatus('Processing Error: ' + err.message, 'bg-red-50 text-red-600 border border-red-100');
            }
        }

        function showStatus(msg, classes) {
            status.textContent = msg;
            status.className = `mt-6 text-center p-4 rounded-lg font-medium text-sm ${classes}`;
            status.classList.remove('hidden');
        }

        downloadBtn.addEventListener('click', () => {
            if (!convertedData) return;
            const csv = Papa.unparse(convertedData);
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `GoogleContacts_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
</body>
</html>
