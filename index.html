<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAC Contact Converter | antloh-sh</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900">

    <header class="gradient-bg text-white py-12 px-6 shadow-xl">
        <div class="max-w-4xl mx-auto flex flex-col md:flex-row justify-between items-center">
            <div>
                <h1 class="text-4xl font-extrabold tracking-tight">AAC Contact Converter</h1>
                <p class="text-slate-400 mt-2 text-lg">Format membership data for Google Contacts import</p>
            </div>
            <div class="mt-6 md:mt-0 text-right">
                <span class="text-xs font-mono bg-slate-800 text-slate-300 px-3 py-1 rounded-full border border-slate-700">
                    Repo: antloh-sh/contact-csv
                </span>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto -mt-10 px-6 pb-20">
        <div class="bg-white rounded-2xl card-shadow p-8 md:p-12 border border-slate-200">
            
            <section class="mb-10">
                <div class="flex items-center mb-4">
                    <span class="flex items-center justify-center w-8 h-8 rounded-full bg-indigo-600 text-white text-sm font-bold mr-3">1</span>
                    <h2 class="text-xl font-bold text-slate-800">Filter by Modified Date</h2>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-50 p-6 rounded-xl border border-slate-100">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Modified From</label>
                        <input type="date" id="startDate" class="filter-input w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Modified To</label>
                        <input type="date" id="endDate" class="filter-input w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
                    </div>
                </div>
            </section>

            <section class="mb-10">
                <div class="flex items-center mb-4">
                    <span class="flex items-center justify-center w-8 h-8 rounded-full bg-indigo-600 text-white text-sm font-bold mr-3">2</span>
                    <h2 class="text-xl font-bold text-slate-800">Upload Source File</h2>
                </div>
                <div class="relative group">
                    <input type="file" id="csvInput" accept=".csv" class="hidden">
                    <label for="csvInput" class="flex flex-col items-center justify-center w-full h-40 border-2 border-dashed border-slate-300 rounded-xl cursor-pointer hover:bg-indigo-50 hover:border-indigo-300 transition-all">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6">
                            <svg class="w-10 h-10 mb-3 text-slate-400 group-hover:text-indigo-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                            <p id="fileLabel" class="mb-2 text-sm text-slate-700 font-semibold text-center px-4">Click to select DataListing-AACMembership.csv</p>
                            <p class="text-xs text-slate-400">Processing is done locally in your browser.</p>
                        </div>
                    </label>
                </div>
            </section>

            <div id="status" class="mt-6 hidden text-center p-4 rounded-xl font-medium text-sm animate-pulse"></div>

            <div id="actions" class="mt-10 flex flex-col md:flex-row justify-center items-center gap-6 hidden">
                <button id="downloadBtn" class="w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 text-white px-12 py-4 rounded-xl font-bold text-lg shadow-lg shadow-indigo-100 transition-all transform active:scale-95">
                    Download Google Contacts CSV
                </button>
                <button onclick="location.reload()" class="text-slate-400 hover:text-slate-600 text-sm font-bold uppercase tracking-widest transition-colors">
                    Reset App
                </button>
            </div>
        </div>

        <div class="mt-12 text-center text-slate-400 text-sm">
            <p>© 2026 AAC Data Management Utility</p>
        </div>
    </main>

    <script>
        const csvInput = document.getElementById('csvInput');
        const fileLabel = document.getElementById('fileLabel');
        const downloadBtn = document.getElementById('downloadBtn');
        const status = document.getElementById('status');
        const actions = document.getElementById('actions');
        const startDateInput = document.getElementById('startDate');
        const endDateInput = document.getElementById('endDate');

        let rawParsedData = null; 
        let finalConvertedData = null;

        // Handle File Selection
        csvInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            fileLabel.innerHTML = `Selected File:<br><span class="text-indigo-600 font-mono text-xs">${file.name}</span>`;
            
            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    rawParsedData = results.data;
                    runTransformation();
                }
            });
        });

        // Handle Reactive Date Changes
        [startDateInput, endDateInput].forEach(input => {
            input.addEventListener('change', () => {
                if (rawParsedData) runTransformation();
            });
        });

        function parseModifiedDate(dateStr) {
            if (!dateStr) return null;
            // Clean common artifacts (newlines, trailing spaces)
            const dateObj = new Date(dateStr.trim());
            return isNaN(dateObj.getTime()) ? null : dateObj;
        }

        function toProperCase(str) {
            if (!str) return "";
            return str.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
        }

        function getSuffix(pc) {
            const code = parseInt(pc);
            if (isNaN(code)) return "@OB";
            if (code >= 347467 && code <= 349979) return "@SN";
            if (code >= 360001 && code <= 362016) return "@JS";
            if (code >= 367819 && code <= 369977) return "@MG";
            if (code >= 534068 && code <= 539746) return "@PL";
            return "@OB";
        }

        function runTransformation() {
            if (!rawParsedData) return;

            try {
                const startFilter = startDateInput.value ? new Date(startDateInput.value) : null;
                const endFilter = endDateInput.value ? new Date(endDateInput.value) : null;

                // VALIDITY CHECK: Logical date range
                if (startFilter && endFilter && startFilter > endFilter) {
                    showStatus('⚠️ Logical Error: "From" date is later than "To" date.', 'bg-red-50 text-red-600 border border-red-200');
                    startDateInput.classList.add('border-red-400');
                    endDateInput.classList.add('border-red-400');
                    actions.classList.add('hidden');
                    return;
                } else {
                    startDateInput.classList.remove('border-red-400');
                    endDateInput.classList.remove('border-red-400');
                }

                if (endFilter) endFilter.setHours(23, 59, 59, 999);

                // 1. Filter Based on ModifiedOn
                const filtered = rawParsedData.filter(row => {
                    if (!startFilter && !endFilter) return true;
                    const rowDate = parseModifiedDate(row.ModifiedOn);
                    if (!rowDate) return false;
                    if (startFilter && rowDate < startFilter) return false;
                    if (endFilter && rowDate > endFilter) return false;
                    return true;
                });

                if (filtered.length === 0) {
                    showStatus('No records found for the selected dates.', 'bg-amber-50 text-amber-700 border border-amber-200');
                    actions.classList.add('hidden');
                    return;
                }

                // 2. Map Columns to Google Format
                finalConvertedData = filtered.map(row => {
                    const postalCode = row.PersonAddressPostalCode ? row.PersonAddressPostalCode.toString().replace('.0', '').padStart(6, '0') : "";
                    return {
                        "Name Prefix": row.Salutation || "",
                        "First Name": toProperCase(row.FullName || ""),
                        "Address 1 - Postal Code": postalCode,
                        "Name Suffix": getSuffix(postalCode),
                        "Phone 1 - Value": row.MobilePhone ? row.MobilePhone.toString().replace('.0', '').trim() : "",
                        "Phone 1 - Type": row.MobilePhone ? "Mobile" : "",
                        "Phone 2 - Value": row.HomePhone ? row.HomePhone.toString().replace('.0', '').trim() : "",
                        "Phone 2 - Type": row.HomePhone ? "Home" : ""
                    };
                });

                showStatus(`✅ Success! ${finalConvertedData.length} records ready to export.`, 'bg-green-50 text-green-700 border border-green-200');
                actions.classList.remove('hidden');

            } catch (err) {
                showStatus('Error: ' + err.message, 'bg-red-50 text-red-600 border border-red-200');
            }
        }

        function showStatus(msg, classes) {
            status.textContent = msg;
            status.className = `mt-8 text-center p-4 rounded-xl font-medium text-sm border ${classes}`;
            status.classList.remove('hidden');
        }

        downloadBtn.addEventListener('click', () => {
            if (!finalConvertedData) return;
            const csv = Papa.unparse(finalConvertedData);
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `GoogleContacts_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        });
    </script>
</body>
</html>
